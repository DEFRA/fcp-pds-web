environment: production
environmentCode: prd
ingress:
  class: nginx
  endpoint: fcp-pds-web-prd
  server: azure.defra.cloud
container:
  payEventStoreAzureStorageConnectionString: dummy
  payInjectionAzureStorageConnectionString: dummy
  docAzureStorageConnectionString: dummy
  pdsAzureStorageConnectionString: dummy
  payAzureStorageAccountName: prdffcpayst1001
  docAzureStorageAccountName: prdffcdocst1001

secretProviderClass:
  azure:
    keyvaultName: PRDFFCINFKV1001
    objects:
      - objectName: prd-ffcahwr-appInsights-connectionString
        objectType: secret

  secretObjects:
    - secretName: fcp-pds-web
      type: Opaque
      data:
        - objectName: prd-ffcahwr-appInsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
