environment: production
environmentCode: pre
ingress:
  class: nginx
  endpoint: fcp-pds-web-pre
  server: azure.defra.cloud
container:
  paymentsEndpoint: http://ffc-pay-processing.ffc-pay
  trackingEndpoint: http://ffc-pay-tracking.ffc-pay
  injectionEndpoint: http://ffc-pay-injection.ffc-pay
  alertingEndpoint: http://ffc-pay-alerting.ffc-pay
  statementPublisherEndpoint: http://ffc-doc-statement-publisher.ffc-doc
  retentionEndpoint: http://fcp-pds-data-retention.fcp-pds
  batchProcessorEndpoint: http://ffc-pay-batch-processor.ffc-pay
  payEventStoreAzureStorageConnectionString: dummy
  payInjectionAzureStorageConnectionString: dummy
  docAzureStorageConnectionString: dummy
  pdsAzureStorageConnectionString: dummy
  payAzureStorageAccountName: preffcpayst1001
  docAzureStorageAccountName: preffcdocst1001
  azureAppRegistrationRedirectUrl: authenticate

secretProviderClass:
  azure:
    keyvaultName: PREFFCINFKV1001
    objects:
      - objectName: pre-ffcahwr-appInsights-connectionString
        objectType: secret
      - objectName: pre-fcp-pds-web-client-secret
        objectType: secret
      - objectName: pre-ffc-pay-cookie-password
        objectType: secret

  secretObjects:
    - secretName: fcp-pds-web
      type: Opaque
      data:
        - objectName: pre-ffcahwr-appInsights-connectionString
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - objectName: pre-fcp-pds-web-client-secret
          key: AZUREID_CLIENT_SECRET
        - objectName: pre-ffc-pay-cookie-password
          key: COOKIE_PASSWORD
